openapi: 3.0.3
info:
  title: LLM Gateway
  version: 0.1.0
  description: >
    OpenAI-compatible gateway with auth, rate limiting, token budgets, exact + semantic caching, provider fallback and
    circuit breaking. Hand-written to match the implementation; see docs/API.md for behavioural detail.
servers:
  - url: http://localhost:8080
tags:
  - { name: openai, description: OpenAI-compatible endpoints (tenant API key) }
  - { name: ops, description: Health and metrics }
  - { name: admin, description: Admin API (admin token) }
components:
  securitySchemes:
    tenantKey: { type: http, scheme: bearer, description: "Gateway API key, lgw_<prefix>_<secret>" }
    adminToken: { type: http, scheme: bearer, description: ADMIN_API_TOKEN }
  headers:
    RequestId: { description: Request correlation ID, schema: { type: string } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { type: string, enum: [invalid_request_error, authentication_error, permission_error, rate_limit_error, budget_exceeded_error, provider_error, service_unavailable_error, internal_error] }
            code: { type: string, example: RATE_LIMIT_EXCEEDED }
            request_id: { type: string }
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string, description: Plain string only; multimodal arrays are not supported }
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, example: mock-model }
        messages: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/Message' } }
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        max_tokens: { type: integer, minimum: 1, maximum: 131072 }
        stop: { oneOf: [{ type: string }, { type: array, maxItems: 4, items: { type: string } }] }
        n: { type: integer, enum: [1] }
        stream: { type: boolean, default: false }
      description: >
        tools, tool_choice, functions, function_call, response_format, logprobs and top_logprobs are rejected with 400.
        Other unknown fields are ignored.
    ChatCompletion:
      type: object
      properties:
        id: { type: string }
        object: { type: string, enum: [chat.completion] }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/Message' }
              finish_reason: { type: string }
        usage:
          type: object
          description: Present only when the provider reported usage
          properties: { prompt_tokens: { type: integer }, completion_tokens: { type: integer }, total_tokens: { type: integer } }
    ModelList:
      type: object
      properties:
        object: { type: string, enum: [list] }
        data:
          type: array
          items: { type: object, properties: { id: { type: string }, object: { type: string }, created: { type: integer }, owned_by: { type: string } } }
    ProviderStatus:
      type: object
      properties:
        name: { type: string }
        configured: { type: boolean }
        enabled: { type: boolean }
        health: { type: string, enum: [healthy, disabled, circuit_open, circuit_half_open] }
        circuit:
          type: object
          properties:
            state: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
            consecutiveFailures: { type: integer }
            retryAfterMs: { type: integer }
        models: { type: array, items: { type: string } }
  responses:
    Error:
      description: Error
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
paths:
  /v1/chat/completions:
    post:
      tags: [openai]
      security: [{ tenantKey: [] }]
      summary: Create a chat completion (JSON or SSE stream)
      parameters:
        - { in: header, name: Cache-Control, required: false, schema: { type: string, enum: [no-cache, no-store] }, description: Skip cache reads (no-cache) or reads and writes (no-store) }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatRequest' } } }
      responses:
        '200':
          description: "Completion (application/json) or stream (text/event-stream, terminated by a final [DONE] data event)"
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            X-Cache: { schema: { type: string, enum: [HIT, MISS, BYPASS] } }
            X-Cache-Type: { schema: { type: string, enum: [exact, semantic] } }
            X-Semantic-Similarity: { schema: { type: string } }
            X-Provider: { schema: { type: string } }
            X-Fallback-Used: { schema: { type: string, enum: ['true'] } }
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/ChatCompletion' } }
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /v1/models:
    get:
      tags: [openai]
      security: [{ tenantKey: [] }]
      summary: List models of configured, enabled providers
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ModelList' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /health:
    get: { tags: [ops], summary: Liveness, responses: { '200': { description: Process is alive } } }
  /ready:
    get:
      tags: [ops]
      summary: Readiness (PostgreSQL and Redis)
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics (admin token required only if METRICS_REQUIRE_AUTH=true)
      responses: { '200': { description: Prometheus text format, content: { text/plain: { schema: { type: string } } } } }
  /api/tenants:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Create a tenant
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 }, monthly_token_budget: { type: integer, minimum: 0 } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /api/keys:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Create an API key (plaintext returned once)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [tenant_id], properties: { tenant_id: { type: string, format: uuid }, label: { type: string, maxLength: 100 } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: string }, prefix: { type: string }, api_key: { type: string }, note: { type: string } } } } } }
        '404': { $ref: '#/components/responses/Error' }
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: List key metadata for a tenant (never secrets)
      parameters: [{ in: query, name: tenant_id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /api/keys/{id}:
    delete:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Revoke a key
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Revoked }, '404': { $ref: '#/components/responses/Error' } }
  /api/providers:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Provider health and circuit state
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ProviderStatus' } } } } } } } }
  /api/providers/{provider}/enable:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Enable a provider (persisted, audited)
      parameters: [{ in: path, name: provider, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
  /api/providers/{provider}/disable:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Disable a provider (persisted, audited) - used for failover demos
      parameters: [{ in: path, name: provider, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
  /api/providers/{provider}/failure-mode:
    post:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Set a mock provider's failure mode (demo chaos control)
      parameters: [{ in: path, name: provider, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [none, http_500, http_503, timeout, bad_request, stream_cut] } } } } }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Error' } }
  /api/usage:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Monthly token usage for a tenant
      parameters: [{ in: query, name: tenant_id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
  /api/requests:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Request log (newest first, cursor pagination)
      parameters:
        - { in: query, name: tenant_id, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: before, schema: { type: string }, description: Cursor from next_cursor }
      responses: { '200': { description: OK } }
  /api/cache/stats:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Cache hit/miss statistics and estimated savings
      parameters:
        - { in: query, name: hours, schema: { type: integer, minimum: 1, maximum: 720, default: 24 } }
        - { in: query, name: tenant_id, schema: { type: string, format: uuid } }
      responses: { '200': { description: OK } }
  /api/costs:
    get:
      tags: [admin]
      security: [{ adminToken: [] }]
      summary: Estimated cost and savings over time
      parameters:
        - { in: query, name: hours, schema: { type: integer, minimum: 1, maximum: 720, default: 24 } }
        - { in: query, name: bucket, schema: { type: string, enum: [hour, day], default: hour } }
        - { in: query, name: tenant_id, schema: { type: string, format: uuid } }
      responses: { '200': { description: OK } }
