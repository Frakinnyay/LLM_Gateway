# Serves the dashboard and reverse-proxies the gateway on the SAME origin (no CORS needed).
# /metrics and /health are intentionally NOT proxied.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }

  # SSE: no buffering, long read timeout, HTTP/1.1 keep-alive to the upstream.
  location /v1/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 330s;
    client_max_body_size 512k;
  }
}
